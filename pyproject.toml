[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "studiolink"
dynamic = ["version"]
description = "Sync Ollama-downloaded GGUF models into LM Studio."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "StudioLink contributors" }
]
keywords = ["ollama", "lm-studio", "gguf", "cli", "sync"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pyright>=1.1.390",
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.urls]
Homepage = "https://github.com/ensevengg/StudioLink"
Repository = "https://github.com/ensevengg/StudioLink"

[project.scripts]
sdl = "studiolink.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "studiolink.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
